# Tool configuration only; the agent runs as `python main.py` from the repository root.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S113"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
